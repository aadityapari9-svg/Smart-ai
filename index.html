<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART AI</title>
<style>
:root {
  --bg: #f3f5fb;
  --panel: #ffffff;
  --text: #182033;
  --muted: #687086;
  --accent: #6558e8;
  --border: #e0e4ef;
}
body.dark {
  --bg: #10131c;
  --panel: #1b2030;
  --text: #f4f5ff;
  --muted: #a7aec3;
  --border: #30364a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: .2s;
}
header {
  height: 65px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 22px; font-weight: bold; color: var(--accent); }
button, select {
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--panel);
  color: var(--text);
}
.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  max-width: 1200px;
  height: calc(100dvh - 65px);
  margin: auto;
}
aside {
  padding: 18px 12px;
  border-right: 1px solid var(--border);
  background: var(--panel);
}
aside button { width: 100%; margin-bottom: 10px; text-align: left; }
main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 18px;
}
.welcome { text-align: center; margin: auto 0 20px; }
.welcome h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 8px; }
.welcome p { color: var(--muted); }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.message {
  max-width: 800px;
  margin: 12px auto;
  padding: 14px 16px;
  border-radius: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.user { background: var(--accent); color: white; border: none; }
.composer { max-width: 800px; width: 100%; margin: 12px auto 0; }
.controls { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
#chatForm {
  display: flex;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
}
#prompt {
  flex: 1;
  min-width: 0;
  resize: none;
  border: none;
  outline: none;
  padding: 10px;
  font: inherit;
  color: var(--text);
  background: transparent;
}
.primary { background: var(--accent); color: white; border: none; }
.small { font-size: 12px; color: var(--muted); text-align: center; }
@media(max-width:650px) {
  .layout { grid-template-columns: 1fr; }
  aside {
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 8px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }
  aside button { width: auto; white-space: nowrap; margin: 0; }
  main { padding: 12px; }
  .welcome h1 { font-size: 30px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ SMART AI</div>
  <button id="themeButton">🌙 Dark mode</button>
</header><div class="layout">
  <aside>
    <button id="newChat">＋ New chat</button>
    <button data-mode="study">📚 Study assistant</button>
    <button data-mode="coding">💻 Coding assistant</button>
    <button data-mode="writing">✍️ Writing assistant</button>
    <button data-mode="general">🤖 General AI</button>
  </aside>  <main>
    <div class="welcome" id="welcome">
      <h1>What can I help you with?</h1>
      <p>Your ideas. Your questions. One SMART AI.</p>
    </div>
    <div id="messages" aria-live="polite"></div><div class="composer">
  <div class="controls">
    <button id="voiceButton">🎤 Voice input</button>
    <button id="speakButton">🔊 Read last answer</button>
    <select id="mode">
      <option value="general">General AI</option>
      <option value="study">Study assistant</option>
      <option value="coding">Coding assistant</option>
      <option value="writing">Writing assistant</option>
    </select>
  </div>
  <form id="chatForm">
    <textarea id="prompt" rows="1" placeholder="Message SMART AI..." required></textarea>
    <button class="primary" type="submit" id="sendButton">➤</button>
  </form>
  <p class="small">SMART AI can make mistakes. Check important information.</p>
</div>

  </main>
</div><script>
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const promptBox = document.getElementById("prompt");
const modeBox = document.getElementById("mode");
const sendButton = document.getElementById("sendButton");
let history = [];
let lastAnswer = "";

function addMessage(text, role) {
  const item = document.createElement("div");
  item.className = "message " + role;
  item.textContent = text;
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}
function newChat() {
  history = [];
  lastAnswer = "";
  messages.replaceChildren();
  welcome.style.display = "";
  promptBox.value = "";
}
document.getElementById("newChat").addEventListener("click", newChat);

document.getElementById("themeButton").addEventListener("click", () => {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  document.getElementById("themeButton").textContent = dark ? "☀️ Light mode" : "🌙 Dark mode";
  try { localStorage.setItem("smart-ai-theme", dark ? "dark" : "light"); } catch(e) {}
});
try {
  if (localStorage.getItem("smart-ai-theme") === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeButton").textContent = "☀️ Light mode";
  }
} catch(e) {}

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", () => {
    modeBox.value = button.dataset.mode;
    promptBox.focus();
  });
});

document.getElementById("voiceButton").addEventListener("click", () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Voice input is not supported by this browser. Try a supported browser or your keyboard microphone.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = event => {
    promptBox.value = event.results[0][0].transcript;
    promptBox.focus();
  };
  recognition.onerror = () => alert("Voice input couldn't start. Check microphone permission.");
  recognition.start();
});

document.getElementById("speakButton").addEventListener("click", () => {
  if (!lastAnswer) return alert("SMART AI has no answer to read yet.");
  if (!("speechSynthesis" in window)) return alert("Read aloud is not supported in this browser.");
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(lastAnswer));
});

document.getElementById("chatForm").addEventListener("submit", async event => {
  event.preventDefault();
  const text = promptBox.value.trim();
  if (!text) return;
  welcome.style.display = "none";
  addMessage(text, "user");
  history.push({role: "user", content: text});
  promptBox.value = "";
  sendButton.disabled = true;

  const mode = modeBox.value;
  let reply = "";
  if (mode === "study") {
    reply = "📚 Study Assistant mode is selected.\n\nI can help explain your question, but real AI answers are not connected yet. We will connect a free AI service in a later step.\n\nYour question: " + text;
  } else if (mode === "coding") {
    reply = "💻 Coding Assistant mode is selected.\n\nReal AI answers are not connected yet. We will connect a free AI service in a later step.\n\nYour question: " + text;
  } else if (mode === "writing") {
    reply = "✍️ Writing Assistant mode is selected.\n\nReal AI answers are not connected yet. We will connect a free AI service in a later step.\n\nYour request: " + text;
  } else {
    reply = "🤖 Welcome to SMART AI!\n\nYour website is working, but the AI service is not connected yet. We will add a free AI connection in the next step.\n\nYou asked: " + text;
  }

  addMessage(reply, "assistant");
  history.push({role: "assistant", content: reply});
  lastAnswer = reply;
  sendButton.disabled = false;
  promptBox.focus();
});
</script></body>
      </html>
